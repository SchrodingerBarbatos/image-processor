name: Windows CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  test-and-build:
    name: Test and build EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 Pillow pillow-avif-plugin openpyxl pytest pyinstaller

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Run regression tests
        run: python -m pytest tests/test_core_regressions.py -v

      - name: Build Windows executable
        run: pyinstaller --noconfirm --clean barcode_image_mover_exe.spec

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: image-processor-windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14

  build-macos:
    if: github.event_name == 'workflow_dispatch'
    name: Build macOS app
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 Pillow pillow-avif-plugin openpyxl pytest pyinstaller

      - name: Generate macOS app icon (.icns)
        run: |
          set -e
          mkdir -p icon.iconset
          sips -z 16 16     app_icon.png --out icon.iconset/icon_16x16.png       >/dev/null
          sips -z 32 32     app_icon.png --out icon.iconset/icon_16x16@2x.png    >/dev/null
          sips -z 32 32     app_icon.png --out icon.iconset/icon_32x32.png       >/dev/null
          sips -z 64 64     app_icon.png --out icon.iconset/icon_32x32@2x.png    >/dev/null
          sips -z 128 128   app_icon.png --out icon.iconset/icon_128x128.png     >/dev/null
          sips -z 256 256   app_icon.png --out icon.iconset/icon_128x128@2x.png  >/dev/null
          sips -z 256 256   app_icon.png --out icon.iconset/icon_256x256.png     >/dev/null
          sips -z 512 512   app_icon.png --out icon.iconset/icon_256x256@2x.png  >/dev/null
          sips -z 512 512   app_icon.png --out icon.iconset/icon_512x512.png     >/dev/null
          sips -z 1024 1024 app_icon.png --out icon.iconset/icon_512x512@2x.png  >/dev/null
          iconutil -c icns icon.iconset -o app.icns

      - name: Build .app with PyInstaller
        run: pyinstaller --noconfirm --clean barcode_image_mover_exe.mac.spec

      - name: Ad-hoc code sign
        run: codesign --force --deep -s - "dist/图片处理工具.app"

      - name: Create .dmg
        run: |
          hdiutil create -volname "图片处理工具" \
            -srcfolder "dist/图片处理工具.app" \
            -ov -format UDZO "dist/图片处理工具.dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-processor-macos
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14
